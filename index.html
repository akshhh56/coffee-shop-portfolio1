<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Roast | 3D Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <!-- IMPORT GOOGLE'S 3D MODEL VIEWER -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.1.1/model-viewer.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            color: #ffffff; overflow-x: hidden; background-color: #1a1a1a;
        }
        
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: url('https://images.unsplash.com/photo-1497935586351-b67a49e012bf?ixlib=rb-1.2.1&auto=format&fit=crop&w=1920&q=80') center/cover;
            filter: blur(30px) brightness(0.4); z-index: -1;
        }

        /* --- PAGE TRANSITION OVERLAY --- */
        .page-transition {
            position: fixed; inset: 0; background: #000000; z-index: 9999;
            pointer-events: none; transition: opacity 0.8s ease-in-out;
        }
        .page-transition.fade-out { opacity: 0; }

        nav { padding: 2rem 5%; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 100;}
        .logo { font-size: 1.5rem; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; }
        .nav-links { display: flex; gap: 2rem; }
        .nav-links a { color: white; text-decoration: none; font-weight: 500; opacity: 0.8; transition: 0.3s; }
        .nav-links a:hover { opacity: 1; transform: translateY(-2px); }

        .glass-lite {
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            border-radius: 30px;
        }

        /* --- 3D MODEL CONTAINER --- */
        .cup-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; /* Let users click "through" the container */
            z-index: 0; display: flex; justify-content: center; align-items: center;
        }

        /* Allow interacting with the 3D model specifically */
        .model-wrapper { pointer-events: auto; cursor: grab; }
        .model-wrapper:active { cursor: grabbing; }

        /* The actual 3D Viewer Element */
        model-viewer {
            width: 350px;
            height: 350px;
            /* Creates the continuous levitation effect */
            animation: floatLevitate 5s ease-in-out infinite; 
            filter: drop-shadow(0px 30px 40px rgba(0,0,0,0.8));
            outline: none; /* Removes any weird borders when clicked */
        }

        @keyframes floatLevitate {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-30px); }
            100% { transform: translateY(0px); }
        }

        /* --- SCROLL SECTIONS --- */
        .scrolly-wrapper { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; pointer-events: none;}
        .scrolly-section { height: 100vh; width: 100%; display: flex; justify-content: center; align-items: center; padding: 2rem; max-width: 1200px; margin: 0 auto; }
        .home-glass { max-width: 500px; text-align: center; padding: 3rem; pointer-events: auto;}
        
        h1 { font-size: 3.5rem; font-weight: 900; margin-bottom: 1rem; letter-spacing: -1px; }
        p { font-size: 1.1rem; line-height: 1.6; opacity: 0.9; }
        
        @media (min-width: 769px) {
            .left-side { transform: translateX(-20vw); }
            .right-side { transform: translateX(20vw); }
        }
    </style>
</head>
<body>

    <!-- Smooth Page Fading Transition -->
    <div class="page-transition" id="pageTransition"></div>

    <nav>
        <div class="logo">Daily Roast</div>
        <div class="nav-links">
            <a href="index.html" class="nav-btn">Home</a>
            <a href="menu.html" class="nav-btn">Menu</a>
            <a href="about.html" class="nav-btn">About</a>
        </div>
    </nav>

    <!-- THE 3D MODEL RENDERER -->
    <div class="cup-container">
        <div class="gsap-wrapper model-wrapper">
            <!-- Fixed Model Viewer Setup -->
            <model-viewer 
                src="coffee.glb" 
                alt="A 3D model of a coffee cup"
                orientation="0deg 0deg -15deg" 
                touch-action="pan-y" 
                camera-controls 
                disable-zoom 
                shadow-intensity="1" 
                environment-image="neutral"
                exposure="1.2">
            </model-viewer>
        </div>
    </div>

    <!-- Scrolling Text Overlays -->
    <div class="scrolly-wrapper">
        <section class="scrolly-section">
            <div class="glass-lite home-glass left-side">
                <h1>Brewed.</h1>
                <p>Scroll down to experience our coffee in 3D. You can even swipe left or right on the cup to spin it!</p>
            </div>
        </section>
        <section class="scrolly-section">
            <div class="glass-lite home-glass right-side">
                <h1>Roasted.</h1>
                <p>Sourced globally, roasted locally. Pure aesthetics, rich flavor.</p>
            </div>
        </section>
        <section class="scrolly-section">
            <div class="glass-lite home-glass left-side">
                <h1>Poured.</h1>
                <p>Click the menu to view our full selection.</p>
            </div>
        </section>
    </div>

    <!-- GSAP Scrollytelling Script & Transition Logic -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script>
        /* --- PAGE TRANSITION ANIMATION --- */
        window.onload = () => {
            document.getElementById('pageTransition').classList.add('fade-out');
        };

        document.querySelectorAll('.nav-btn').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault(); 
                let targetURL = this.href;
                document.getElementById('pageTransition').classList.remove('fade-out');
                setTimeout(() => {
                    window.location.href = targetURL;
                }, 800);
            });
        });

        /* --- GSAP SCROLL ANIMATION --- */
        gsap.registerPlugin(ScrollTrigger);
        let mm = gsap.matchMedia();

        mm.add("(min-width: 769px)", () => {
            let tl = gsap.timeline({ scrollTrigger: { trigger: ".scrolly-wrapper", start: "top top", end: "bottom bottom", scrub: 1 }});
            gsap.set(".gsap-wrapper", { x: "-20vw", scale: 0.8 });
            tl.to(".gsap-wrapper", { x: "20vw", scale: 1.5, ease: "power1.inOut" })
              .to(".gsap-wrapper", { x: "-10vw", scale: 2.2, ease: "power1.inOut" });
        });

        mm.add("(max-width: 768px)", () => {
            let tl = gsap.timeline({ scrollTrigger: { trigger: ".scrolly-wrapper", start: "top top", end: "bottom bottom", scrub: 1 }});
            gsap.set(".gsap-wrapper", { x: "0vw", y:"-10vh", scale: 0.7 });
            tl.to(".gsap-wrapper", { scale: 1.1, y:"0vh", ease: "power1.inOut" })
              .to(".gsap-wrapper", { scale: 1.4, y:"5vh", ease: "power1.inOut" });
        });
    </script>
</body>
</html>
